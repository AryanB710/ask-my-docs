# Any OpenAI-compatible API (OpenAI, Groq, Together, OpenRouter, vLLM ...).
# Set base_url/model for your provider and export the key named in api_key_env.
# Add the model's current prices to configs/pricing.yaml so cost-per-request is real.
name: cloud
corpus_dir: data/demo/corpus
index_dir: runs/index
chunking: {max_words: 120, overlap_words: 25, contextual_headers: true}
embedding:
  provider: sentence-transformers
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
retrieval: {mode: hybrid, bm25_k: 30, dense_k: 30, rrf_k: 60, final_k: 5}
reranker: {provider: cross-encoder, model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 20}
llm:
  provider: openai-compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0
  max_tokens: 300
citations: {enforce: true, min_support: 0.6, max_regenerations: 1, on_failure: drop}
gate: {min_evidence_score: 0.2}
observability: {trace_dir: runs/traces, pricing_file: configs/pricing.yaml}
